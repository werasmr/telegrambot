<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>P2P Калькулятор</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ══════════════════════════════════
       TOKENS
    ══════════════════════════════════ */
    :root {
      --bg:       #F3F4F6;
      --surface:  #FFFFFF;
      --hdr:      #111418;
      --accent:   #3D82F6;
      --acc-lt:   #EFF6FF;
      --acc-hv:   #2563EB;
      --ok:       #22C55E;
      --ok-lt:    #F0FDF4;
      --bad:      #EF4444;
      --bad-lt:   #FEF2F2;
      --warn:     #F59E0B;
      --border:   #E5E7EB;
      --in-bdr:   #D1D5DB;
      --txt:      #111418;
      --txt2:     #6B7280;
      --txt3:     #9CA3AF;
      --r:        12px;
      --r-md:      8px;
    }
    /* ══════════════════════════════════
       RESET
    ══════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { height: 100%; }
    body {
      min-height: 100%;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 14px;
      background: var(--bg);
      color: var(--txt);
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    input[type=number] { -moz-appearance: textfield; }
    input[type=number]::-webkit-outer-spin-button,
    input[type=number]::-webkit-inner-spin-button { -webkit-appearance: none; }
    button { font-family: inherit; cursor: pointer; }

    /* ══════════════════════════════════
       SHELL
    ══════════════════════════════════ */
    .app { min-height: 100dvh; display: flex; flex-direction: column; }

    .hdr {
      background: var(--hdr); color: #fff;
      height: 56px; padding: 0 16px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      position: sticky; top: 0; z-index: 100; flex-shrink: 0;
    }
    .hdr-logo {
      display: flex; align-items: center; gap: 9px;
      font-size: 16px; font-weight: 700; letter-spacing: -.3px; white-space: nowrap;
    }
    .hdr-logo-icon {
      width: 30px; height: 30px;
      background: var(--accent); border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 11px; font-weight: 800; flex-shrink: 0; letter-spacing: -.5px;
    }
    .hdr-title { font-size: 15px; font-weight: 600; flex: 1; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hdr-back {
      background: rgba(255,255,255,.13); border: none; color: #fff;
      padding: 0 12px; height: 32px; border-radius: 6px;
      font-size: 13px; font-weight: 500;
      display: flex; align-items: center; gap: 4px;
      transition: background .15s; white-space: nowrap; flex-shrink: 0;
    }
    .hdr-back:hover { background: rgba(255,255,255,.22); }
    .hdr-spc { width: 80px; flex-shrink: 0; }
    .btn-new {
      background: var(--accent); color: #fff; border: none;
      padding: 0 14px; height: 34px; border-radius: var(--r-md);
      font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 5px;
      transition: background .15s; white-space: nowrap; flex-shrink: 0;
    }
    .btn-new:hover { background: var(--acc-hv); }

    .content { flex: 1; width: 100%; max-width: 720px; margin: 0 auto; padding: 16px; }
    @media (min-width: 640px) { .content { padding: 20px; } }

    .view { display: none; }
    .view.active { display: block; }

    /* ══════════════════════════════════
       STAT BAR
    ══════════════════════════════════ */
    .stat-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 8px; margin-bottom: 14px; }
    .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 12px 14px; }
    .stat-lbl { font-size: 10.5px; font-weight: 600; color: var(--txt3); text-transform: uppercase; letter-spacing: .6px; margin-bottom: 5px; }
    .stat-val { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.2; color: var(--txt); }
    .stat-val.ok  { color: var(--ok); }
    .stat-val.bad { color: var(--bad); }

    /* ══════════════════════════════════
       ORDER CARDS
    ══════════════════════════════════ */
    .cards { display: flex; flex-direction: column; gap: 10px; }
    .ocard {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--r);
      padding: 16px; cursor: pointer; position: relative;
      transition: border-color .15s, box-shadow .15s;
      user-select: none; overflow: hidden;
    }
    .ocard:hover { border-color: #93C5FD; box-shadow: 0 2px 12px rgba(61,130,246,.08); }
    .ocard:active { transform: scale(.993); }

    .oc-top { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; margin-bottom: 12px; }
    .oc-name { font-size: 15px; font-weight: 600; }
    .oc-date { font-size: 12px; color: var(--txt3); margin-top: 2px; }
    .oc-del {
      background: none; border: none; color: var(--txt3);
      padding: 4px; border-radius: 5px; line-height: 0;
      opacity: 0; transition: opacity .15s, color .15s, background .15s; flex-shrink: 0;
    }
    .ocard:hover .oc-del { opacity: 1; }
    .oc-del:hover { color: var(--bad); background: var(--bad-lt); }
    @media (max-width: 640px) { .oc-del { opacity: 1; } }

    .oc-meta { display: grid; grid-template-columns: repeat(2,1fr); gap: 7px 14px; margin-bottom: 12px; }
    @media (min-width: 480px) { .oc-meta { grid-template-columns: repeat(4,1fr); } }
    .oc-meta-lbl { font-size: 10.5px; font-weight: 600; color: var(--txt3); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 2px; }
    .oc-meta-val { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }

    .oc-foot { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--border); }
    .oc-profit { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .oc-profit.ok  { color: var(--ok); }
    .oc-profit.bad { color: var(--bad); }
    .oc-pill { font-size: 12px; font-weight: 600; padding: 2px 9px; border-radius: 100px; font-variant-numeric: tabular-nums; }
    .oc-pill.ok  { background: var(--ok-lt);  color: var(--ok); }
    .oc-pill.bad { background: var(--bad-lt); color: var(--bad); }

    /* ══════════════════════════════════
       EMPTY STATE
    ══════════════════════════════════ */
    .empty { display: flex; flex-direction: column; align-items: center; gap: 14px; padding: 56px 20px; text-align: center; }
    .empty-icon { width: 72px; height: 72px; background: var(--acc-lt); border-radius: 50%; display: flex; align-items: center; justify-content: center; }
    .empty-title { font-size: 17px; font-weight: 600; }
    .empty-sub   { font-size: 13.5px; color: var(--txt2); max-width: 280px; }

    /* ══════════════════════════════════
       FORM SECTIONS
    ══════════════════════════════════ */
    .fsec { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; margin-bottom: 10px; }
    .fsec-ttl { font-size: 10.5px; font-weight: 700; color: var(--txt3); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 14px; }

    .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .frow.full { grid-template-columns: 1fr; }
    .frow.tri  { grid-template-columns: 1fr 1fr 1fr; }
    .frow:last-child { margin-bottom: 0; }
    @media (max-width: 480px) {
      .frow      { grid-template-columns: 1fr; }
      .frow.keep2{ grid-template-columns: 1fr 1fr; }
    }

    .fg { display: flex; flex-direction: column; gap: 4px; }
    .flbl { font-size: 11.5px; font-weight: 500; color: var(--txt2); }

    .finp {
      height: 40px; width: 100%; padding: 0 12px;
      background: var(--surface); border: 1px solid var(--in-bdr); border-radius: var(--r-md);
      font-size: 14px; font-family: inherit; color: var(--txt); outline: none;
      transition: border-color .15s, box-shadow .15s;
      font-variant-numeric: tabular-nums;
    }
    .finp:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(61,130,246,.15); }
    .finp.nm { font-size: 15px; font-weight: 500; font-variant-numeric: normal; }

    .fcalc {
      height: 40px; display: flex; align-items: center; padding: 0 12px;
      background: #F9FAFB; border: 1px solid var(--border); border-radius: var(--r-md);
      font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums;
    }

    /* ══════════════════════════════════
       SELL ROWS
    ══════════════════════════════════ */
    .sell-list { display: flex; flex-direction: column; gap: 8px; }

    .srow { background: #F9FAFB; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .srow-idx { font-size: 10px; font-weight: 700; color: var(--txt3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }

    .srow-top { display: grid; grid-template-columns: 1fr 1fr 80px 80px auto; gap: 7px; align-items: flex-end; margin-bottom: 8px; }
    @media (max-width: 600px) {
      .srow-top { grid-template-columns: 1fr 1fr; gap: 7px; }
      .srow-top .srow-rm { grid-column: 2; justify-self: end; }
    }

    .sinp {
      height: 36px; width: 100%; padding: 0 10px;
      background: var(--surface); border: 1px solid var(--in-bdr); border-radius: 7px;
      font-size: 13.5px; font-family: inherit; color: var(--txt); outline: none;
      font-variant-numeric: tabular-nums;
      transition: border-color .15s, box-shadow .15s;
    }
    .sinp:focus { border-color: var(--accent); box-shadow: 0 0 0 2px rgba(61,130,246,.14); }

    .srow-rm {
      width: 36px; height: 36px; background: none;
      border: 1px solid var(--border); border-radius: 7px; color: var(--txt3);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0;
      transition: color .15s, border-color .15s, background .15s;
    }
    .srow-rm:hover { color: var(--bad); border-color: var(--bad); background: var(--bad-lt); }

    .srow-calcs { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; }
    .scalc { display: flex; align-items: center; gap: 4px; }
    .scalc-lbl { color: var(--txt3); font-weight: 500; }
    .scalc-val { font-weight: 600; font-variant-numeric: tabular-nums; }
    .scalc-val.ok  { color: var(--ok); }
    .scalc-val.bad { color: var(--bad); }

    .btn-add-sell {
      display: flex; align-items: center; justify-content: center; gap: 5px;
      width: 100%; height: 38px; margin-top: 8px;
      background: transparent; border: 1.5px dashed var(--in-bdr); border-radius: 10px;
      color: var(--accent); font-size: 13px; font-weight: 600;
      transition: background .15s, border-color .15s;
    }
    .btn-add-sell:hover { background: var(--acc-lt); border-color: var(--accent); }

    /* ══════════════════════════════════
       LIVE SUMMARY
    ══════════════════════════════════ */
    .lsummary { background: var(--surface); border: 1px solid var(--border); border-radius: var(--r); padding: 16px; margin-bottom: 10px; }
    .lsummary-ttl { font-size: 10.5px; font-weight: 700; color: var(--txt3); text-transform: uppercase; letter-spacing: .7px; margin-bottom: 12px; }
    .sr { display: flex; align-items: center; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #F3F4F6; }
    .sr:last-child { border-bottom: none; }
    .sr-lbl { font-size: 13px; color: var(--txt2); }
    .sr-val { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .sr-val.ok   { color: var(--ok); }
    .sr-val.bad  { color: var(--bad); }
    .sr-val.warn { color: var(--warn); }

    /* ══════════════════════════════════
       BUTTONS
    ══════════════════════════════════ */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      height: 40px; padding: 0 18px; border-radius: var(--r-md);
      font-size: 14px; font-weight: 600; border: none;
      transition: background .15s, opacity .15s; white-space: nowrap;
    }
    .btn:disabled { opacity: .35; cursor: not-allowed; pointer-events: none; }
    .btn-prim { background: var(--accent); color: #fff; }
    .btn-prim:hover { background: var(--acc-hv); }
    .btn-sec  { background: var(--surface); color: var(--txt); border: 1px solid var(--border); }
    .btn-sec:hover  { background: #F9FAFB; }
    .btn-dang { background: var(--bad-lt); color: var(--bad); }
    .btn-dang:hover { background: #FEE2E2; }

    .form-acts { display: flex; gap: 8px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }

    /* ══════════════════════════════════
       DETAIL
    ══════════════════════════════════ */
    .df { display: flex; flex-direction: column; gap: 3px; }
    .df-lbl { font-size: 10.5px; font-weight: 600; color: var(--txt3); text-transform: uppercase; letter-spacing: .4px; }
    .df-val { font-size: 14px; font-weight: 600; font-variant-numeric: tabular-nums; }
    .dsrow { background: #F9FAFB; border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; margin-bottom: 7px; }
    .dsrow:last-child { margin-bottom: 0; }
    .dsrow-idx { font-size: 10px; font-weight: 700; color: var(--txt3); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }

    /* ══════════════════════════════════
       MODAL
    ══════════════════════════════════ */
    .overlay { position: fixed; inset: 0; background: rgba(17,20,24,.55); z-index: 200; display: none; align-items: flex-end; justify-content: center; padding: 16px; }
    .overlay.on { display: flex; }
    @media (min-width: 480px) { .overlay { align-items: center; } }
    .modal { background: var(--surface); border-radius: 16px; padding: 24px; width: 100%; max-width: 360px; box-shadow: 0 24px 80px rgba(0,0,0,.22); animation: pop-in .18s cubic-bezier(.34,1.56,.64,1); }
    @keyframes pop-in { from { opacity:0; transform:scale(.93); } to { opacity:1; transform:scale(1); } }
    .modal-ttl  { font-size: 16px; font-weight: 700; margin-bottom: 7px; }
    .modal-body { font-size: 13.5px; color: var(--txt2); margin-bottom: 20px; }
    .modal-acts { display: flex; gap: 8px; justify-content: flex-end; }

    /* ══════════════════════════════════
       SCROLLBAR
    ══════════════════════════════════ */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
<div class="app">

  <header class="hdr" id="hdr">
    <div class="hdr-logo">
      <div class="hdr-logo-icon">P2P</div>
      P2P Калькулятор
    </div>
    <button class="btn-new" onclick="newOrder()">
      <svg width="11" height="11" viewBox="0 0 11 11" fill="currentColor"><path d="M5.75 1.25a.75.75 0 00-1.5 0V4.75H.75a.75.75 0 000 1.5H4.25v3.5a.75.75 0 001.5 0V6.25h3.5a.75.75 0 000-1.5H5.75V1.25z"/></svg>
      Новый ордер
    </button>
  </header>

  <main class="content">

    <!-- ▶ LIST ◀ -->
    <section id="view-list" class="view active">
      <div class="stat-grid">
        <div class="stat-card"><div class="stat-lbl">Прибыль (USDT)</div><div class="stat-val" id="st-profit">—</div></div>
        <div class="stat-card"><div class="stat-lbl">Выручка (₽)</div>   <div class="stat-val" id="st-vol">—</div></div>
        <div class="stat-card"><div class="stat-lbl">Ср. маржа</div>     <div class="stat-val" id="st-margin">—</div></div>
        <div class="stat-card"><div class="stat-lbl">Ордеров</div>       <div class="stat-val" id="st-count">0</div></div>
      </div>
      <div class="cards" id="cards"></div>
    </section>

    <!-- ▶ FORM ◀ -->
    <section id="view-form" class="view">

      <div class="fsec">
        <input type="text" class="finp nm" id="f-name" placeholder="Название ордера (необязательно)" oninput="onBuyInput()">
      </div>

      <!-- Покупка -->
      <div class="fsec">
        <div class="fsec-ttl">Покупка</div>
        <div class="frow keep2">
          <div class="fg">
            <label class="flbl">Курс покупки (₽/USDT)</label>
            <input type="number" class="finp" id="f-buyRate" placeholder="78.00" min="0" step="any" oninput="onBuyInput()">
          </div>
          <div class="fg">
            <label class="flbl">Сумма выплаты (₽)</label>
            <input type="number" class="finp" id="f-payment" placeholder="7 800.00" min="0" step="any" oninput="onBuyInput()">
          </div>
        </div>
        <div class="frow keep2" style="margin-top:2px">
          <div class="fg">
            <label class="flbl">Получено USDT</label>
            <div class="fcalc" id="fc-bought">—</div>
          </div>
          <div class="fg">
            <label class="flbl">Ср. плановый курс продажи</label>
            <div class="fcalc" id="fc-planrate">—</div>
          </div>
        </div>
        <div class="frow full" style="margin-top:2px">
          <div class="fg">
            <label class="flbl">Доплачено из своих (USDT = Σ доплата / курс покупки)</label>
            <div class="fcalc" id="fc-topup-usdt" style="color:var(--warn);font-weight:700">—</div>
          </div>
        </div>
      </div>

      <!-- Ордера продажи -->
      <div class="fsec">
        <div class="fsec-ttl">Ордера продажи</div>
        <div id="sell-list"></div>
        <button class="btn-add-sell" onclick="addSell()">
          <svg width="12" height="12" viewBox="0 0 12 12" fill="currentColor"><path d="M6.75 1.25a.75.75 0 00-1.5 0V5.25H1.25a.75.75 0 000 1.5H5.25v4a.75.75 0 001.5 0v-4h4a.75.75 0 000-1.5h-4V1.25z"/></svg>
          Добавить ордер продажи
        </button>
      </div>

      <!-- Итого -->
      <div class="lsummary">
        <div class="lsummary-ttl">Итого</div>
        <div class="sr"><span class="sr-lbl">Куплено USDT (pokupkausdt)</span>   <span class="sr-val" id="fs-bought">—</span></div>
        <div class="sr"><span class="sr-lbl">USDT клиентам (prodajausdt)</span>  <span class="sr-val" id="fs-prodaja">—</span></div>
        <div class="sr"><span class="sr-lbl">Выручка (₽)</span>                  <span class="sr-val" id="fs-rev">—</span></div>
        <div class="sr"><span class="sr-lbl">Доплат из своих (₽)</span>          <span class="sr-val warn" id="fs-topup">—</span></div>
        <div class="sr"><span class="sr-lbl">Прибыль (USDT)</span>               <span class="sr-val" id="fs-profit">—</span></div>
      </div>

      <div class="form-acts">
        <button class="btn btn-prim" id="btn-save" onclick="saveOrder()" disabled>Сохранить</button>
        <button class="btn btn-sec"  onclick="goList()">Отмена</button>
      </div>

    </section>

    <!-- ▶ DETAIL ◀ -->
    <section id="view-detail" class="view">
      <div id="detail-body"></div>
    </section>

  </main>
</div>

<!-- Confirm modal -->
<div class="overlay" id="overlay" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <div class="modal-ttl"  id="modal-ttl">Удалить ордер?</div>
    <div class="modal-body" id="modal-body">Это действие необратимо.</div>
    <div class="modal-acts">
      <button class="btn btn-sec"  onclick="closeModal()">Отмена</button>
      <button class="btn btn-dang" id="modal-ok">Удалить</button>
    </div>
  </div>
</div>

<script>
'use strict';

/* ═══════════════════════════════════
   STATE
═══════════════════════════════════ */
const LS_KEY   = 'p2p_orders';
const LS_DRAFT = 'p2p_draft';

let orders   = [];
let draft    = null;
let editId   = null;
let saveTimer = null;

/* ═══════════════════════════════════
   PERSISTENCE
═══════════════════════════════════ */
function loadOrders()  { try { orders = JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch { orders = []; } }
function persOrders()  { localStorage.setItem(LS_KEY, JSON.stringify(orders)); }
function saveDraftLS() { if (draft) localStorage.setItem(LS_DRAFT, JSON.stringify(draft)); }
function clearDraftLS(){ localStorage.removeItem(LS_DRAFT); }

/* ═══════════════════════════════════
   IDs
═══════════════════════════════════ */
function genId()  { return 'ord_'  + Date.now() + '_' + Math.random().toString(36).slice(2,7); }
function genSid() { return 'sell_' + Date.now() + '_' + Math.random().toString(36).slice(2,7); }

/* ═══════════════════════════════════
   FORMATTERS
═══════════════════════════════════ */
const fmtRub  = new Intl.NumberFormat('ru-RU', { minimumFractionDigits:2, maximumFractionDigits:2 });
const fmtUsdt = new Intl.NumberFormat('ru-RU', { minimumFractionDigits:6, maximumFractionDigits:6 });
const fmtPct  = new Intl.NumberFormat('ru-RU', { minimumFractionDigits:2, maximumFractionDigits:2 });
const fmtRate = new Intl.NumberFormat('ru-RU', { minimumFractionDigits:2, maximumFractionDigits:4 });

function fRub(n)  { return fin(n) ? fmtRub.format(n)  + '\u00a0₽'    : '—'; }
function fUsdt(n) { return fin(n) ? fmtUsdt.format(n) + '\u00a0USDT' : '—'; }
function fPct(n)  { return fin(n) ? fmtPct.format(n)  + '\u00a0%'    : '—'; }
function fRate(n) { return fin(n) ? fmtRate.format(n)                 : '—'; }
function fin(n)   { return typeof n === 'number' && isFinite(n); }

function fDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('ru-RU', { day:'numeric', month:'short', year:'numeric' });
}
function esc(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ═══════════════════════════════════
   CORE FORMULA
   (exact translation of Python script)

   pokupkausdt = sumpokupki / kurspokupki
   prodajausdt = summaprodaji / (kursprodaji * stavka)
   pribyl = abs((prodajausdt - doplata/kursprodaji) - pokupkausdt)

   For multiple sell orders:
   pokupkausdt = paymentAmount / buyRate
   totalProdaja = Σ (prodajausdt_i − doplata_i/sellRate_i)
   profit = pokupkausdt − totalProdaja   (positive = profit)
═══════════════════════════════════ */
function calc(o) {
  const buyRate       = +o.buyRate       || 0;
  const paymentAmount = +o.paymentAmount || 0;

  // pokupkausdt = сумма выплаты / курс покупки
  const pokupkausdt = buyRate > 0 ? paymentAmount / buyRate : 0;

  const sells = (o.sells || []).map(s => {
    const sellRate   = +s.sellRate   || 0;
    const orderAmount= +s.orderAmount|| 0;
    const profitPct  = +s.profitPct  || 0;
    const topUp      = +s.topUp      || 0;

    const stavka       = 1 + profitPct / 100;
    // prodajausdt = сумма ордера / (курс продажи * ставка)
    const prodajausdt  = (sellRate > 0 && stavka > 0) ? orderAmount / (sellRate * stavka) : 0;
    const topUpUsdt    = sellRate > 0 ? topUp / sellRate : 0;
    const adjustment   = prodajausdt - topUpUsdt;   // USDT net "given out" for this sell
    const effectiveRate = sellRate * stavka;         // actual rate client pays

    return { ...s, sellRate, orderAmount, profitPct, topUp,
             stavka, prodajausdt, topUpUsdt, adjustment, effectiveRate };
  });

  const totalProdaja   = sells.reduce((a,s) => a + s.adjustment,  0);
  const totalRevenue   = sells.reduce((a,s) => a + s.orderAmount, 0);
  const totalTopUp     = sells.reduce((a,s) => a + s.topUp,       0);
  // доплата в USDT = Σ doplata / buyRate (курс покупки, без ставки)
  const totalTopUpUsdt = buyRate > 0 ? totalTopUp / buyRate : 0;
  const profit         = pokupkausdt - totalProdaja;  // positive = profit

  // weighted avg planned sell rate
  const totalOrders   = sells.reduce((a,s) => a + s.orderAmount, 0);
  const wtdEffRate    = totalOrders > 0
    ? sells.reduce((a,s) => a + s.effectiveRate * s.orderAmount, 0) / totalOrders : 0;

  return {
    buyRate, paymentAmount, pokupkausdt,
    sells, totalProdaja, totalRevenue, totalTopUp, totalTopUpUsdt, profit, wtdEffRate,
  };
}

function goList() { showView('list'); renderList(); }

function renderList() {
  const sorted = [...orders].sort((a,b) => (b.createdAt||'').localeCompare(a.createdAt||''));

  let totProfit = 0, totVol = 0;
  sorted.forEach(o => { const c = calc(o); totProfit += c.profit; totVol += c.totalRevenue; });
  const has = sorted.length > 0;

  const pe = document.getElementById('st-profit');
  pe.textContent = has ? (totProfit >= 0 ? '+' : '') + fmtUsdt.format(totProfit) + '\u00a0USDT' : '—';
  pe.className   = 'stat-val' + (has ? (totProfit >= 0 ? ' ok' : ' bad') : '');
  document.getElementById('st-vol').textContent   = has ? fRub(totVol) : '—';
  document.getElementById('st-count').textContent = sorted.length;

  // avg margin across all orders
  const totalSells = sorted.reduce((a,o) => a + (o.sells||[]).length, 0);
  document.getElementById('st-margin').textContent = totalSells > 0
    ? fPct(sorted.reduce((a,o) => {
        return a + (o.sells||[]).reduce((b,s) => b + (+s.profitPct||0), 0);
      }, 0) / totalSells)
    : '—';

  const container = document.getElementById('cards');
  if (!sorted.length) {
    container.innerHTML = `

          </svg>

        <button class="btn btn-prim" onclick="newOrder()">+ Новый ордер</button>
      </div>`;
    return;
  }

  container.innerHTML = sorted.map(o => {
    const c   = calc(o);
    const lbl = o.name || ('Ордер от ' + fDate(o.createdAt));
    const pp  = c.profit >= 0;
    return `
      <div class="ocard" onclick="viewOrder('${o.id}')"
           ontouchstart="tsStart('${o.id}',event)" ontouchend="tsEnd()" ontouchmove="tsMove(event)">
        <div class="oc-top">
          <div>
            <div class="oc-name">${esc(lbl)}</div>
            <div class="oc-date">${fDate(o.createdAt)}</div>
          </div>
          <button class="oc-del" onclick="event.stopPropagation();askDel('${o.id}')" title="Удалить">
            <svg width="14" height="14" viewBox="0 0 14 14" fill="currentColor">
              <path d="M5.25 1.75a.5.5 0 01.5-.5h2.5a.5.5 0 01.5.5v.75H12a.5.5 0 010 1H2a.5.5 0 010-1h3.25V1.75zM3.1 4.5h7.8l-.638 7.01A1 1 0 019.267 12.5H4.733a1 1 0 01-.994-.99L3.1 4.5zM5.5 6a.5.5 0 011 0v4a.5.5 0 01-1 0V6zm3 0a.5.5 0 011 0v4a.5.5 0 01-1 0V6z"/>

          <div><div class="oc-meta-lbl">pokupkausdt</div>   <div class="oc-meta-val">${fmtUsdt.format(c.pokupkausdt)}</div></div>

let tsId=null, tsX=0, tsY=0, tsTmr=null;
function tsStart(id,e){ tsId=id; tsX=e.touches[0].clientX; tsY=e.touches[0].clientY; tsTmr=setTimeout(()=>{tsTmr=null;askDel(id);},620); }
function tsMove(e){ if(!tsTmr) return; const dx=e.touches[0].clientX-tsX,dy=Math.abs(e.touches[0].clientY-tsY); if(dy>12){clearTimeout(tsTmr);tsTmr=null;return;} if(Math.abs(dx)>10){clearTimeout(tsTmr);tsTmr=null;} if(dx<-60){askDel(tsId);} }
function tsEnd(){ if(tsTmr){clearTimeout(tsTmr);tsTmr=null;} }

function newOrder() {
  editId = null;
  draft  = { id:genId(), createdAt:new Date().toISOString(), name:'', buyRate:'', paymentAmount:'', sells:[] };
  fillForm();
  showView('form');
}

function editOrder(id) {
  const o = orders.find(x => x.id===id);
  if (!o) return;
  editId = id;
  draft  = JSON.parse(JSON.stringify(o));
  fillForm();
  showView('form');
}

function viewOrder(id) {
  const o = orders.find(x => x.id===id);
  if (!o) return;
  renderDetail(o);
  showView('detail');
}

/* ═══════════════════════════════════
   FORM
═══════════════════════════════════ */
function fillForm() {
  const nv = v => (v !== '' && v != null) ? v : '';
  document.getElementById('f-name').value    = draft.name          || '';
  document.getElementById('f-buyRate').value = nv(draft.buyRate);
  document.getElementById('f-payment').value = nv(draft.paymentAmount);
  renderSells();
  recalc();
}

function onBuyInput() {
  draft.name          = document.getElementById('f-name').value;
  draft.buyRate       = document.getElementById('f-buyRate').value;
  draft.paymentAmount = document.getElementById('f-payment').value;
  recalc();
  schedSave();
}

function recalc() {
  const c   = calc(draft);
  const has = c.sells.some(s => s.orderAmount > 0 && s.sellRate > 0);

  // Purchase calcs
  document.getElementById('fc-bought').textContent   = c.pokupkausdt > 0 ? fmtUsdt.format(c.pokupkausdt) + '\u00a0USDT' : '—';
  document.getElementById('fc-planrate').textContent = c.wtdEffRate  > 0 ? fRate(c.wtdEffRate) + '\u00a0₽/USDT' : '—';
  document.getElementById('fc-topup-usdt').textContent =
    c.totalTopUp > 0 ? '\u2212\u00a0' + fmtUsdt.format(c.totalTopUpUsdt) + '\u00a0USDT' : (c.paymentAmount > 0 ? '0\u00a0USDT' : '—');

  // Per-sell spans (no re-render)
  c.sells.forEach(s => {
    const active = s.orderAmount > 0 && s.sellRate > 0;
    const setS = (id, txt, cls) => {
      const el = document.getElementById(id + s.id);
      if (!el) return;
      el.textContent = txt;
      if (cls !== undefined) el.className = 'scalc-val ' + cls;
    };
    setS('rv-', active ? fRub(s.orderAmount) : '—');
    setS('er-', active ? fRate(s.effectiveRate) + '\u00a0₽' : '—');
    setS('pr-', active ? fmtUsdt.format(s.prodajausdt) + '\u00a0USDT' : '—');
    setS('tp-', active && s.topUp > 0 ? fmtUsdt.format(s.topUpUsdt) + '\u00a0USDT' : (active ? '0\u00a0USDT' : '—'));
  });

  // Summary
  const sv = (id, txt, cls) => {
    const el = document.getElementById(id);
    if (!el) return;
    el.textContent = txt;
    el.className   = 'sr-val' + (cls ? ' ' + cls : '');
  };
  sv('fs-bought',  c.pokupkausdt > 0 ? fmtUsdt.format(c.pokupkausdt) + '\u00a0USDT' : '—');
  sv('fs-prodaja', has ? fmtUsdt.format(c.totalProdaja) + '\u00a0USDT' : '—');
  sv('fs-rev',     has ? fRub(c.totalRevenue) : '—');
  sv('fs-topup',   c.totalTopUp > 0 ? '−\u00a0' + fRub(c.totalTopUp) : has ? '0\u00a0₽' : '—', c.totalTopUp > 0 ? 'warn' : '');
  sv('fs-profit',  has || c.pokupkausdt > 0
    ? (c.profit >= 0 ? '+' : '') + fmtUsdt.format(c.profit) + '\u00a0USDT' : '—',
    c.profit >= 0 ? 'ok' : 'bad');

  document.getElementById('btn-save').disabled = !(c.buyRate > 0 && c.paymentAmount > 0);
}

              <path d="M1.97 1.97a.75.75 0 011.06 0L5.5 4.44l2.47-2.47a.75.75 0 111.06 1.06L6.56 5.5l2.47 2.47a.75.75 0 11-1.06 1.06L5.5 6.56 3.03 9.03a.75.75 0 01-1.06-1.06L4.44 5.5 1.97 3.03a.75.75 0 010-1.06z"/>

function addSell() {
  draft.sells.push({ id:genSid(), sellRate:'', orderAmount:'', profitPct:'', topUp:'' });
  renderSells();
  recalc();
  schedSave();
}

function removeSell(sid) {
  draft.sells = draft.sells.filter(s => s.id !== sid);
  renderSells();
  recalc();
  schedSave();
}

function onSellInput(sid, field, val) {
  const s = draft.sells.find(s => s.id === sid);
  if (s) { s[field] = val; recalc(); schedSave(); }
}

/* ═══════════════════════════════════
   AUTO-SAVE
═══════════════════════════════════ */
function schedSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => { saveTimer = null; saveDraftLS(); }, 500);
}

/* ═══════════════════════════════════
   SAVE ORDER
═══════════════════════════════════ */
function saveOrder() {
  if (!draft) return;
  draft.name          = document.getElementById('f-name').value.trim();
  draft.buyRate       = +document.getElementById('f-buyRate').value || 0;
  draft.paymentAmount = +document.getElementById('f-payment').value || 0;
  draft.sells = draft.sells.map(s => ({
    ...s,
    sellRate:    +s.sellRate    || 0,
    orderAmount: +s.orderAmount || 0,
    profitPct:   +s.profitPct   || 0,
    topUp:       +s.topUp       || 0,
  }));

  if (editId) {
    const idx = orders.findIndex(o => o.id === editId);
    if (idx >= 0) orders[idx] = { ...draft };
  } else {
    orders.unshift({ ...draft });
  }
  persOrders();
  clearDraftLS();
  draft = null; editId = null;
  goList();
}

      <div class="sr"><span class="sr-lbl">USDT клиентам (prodaja)</span> <span class="sr-val">${fmtUsdt.format(c.totalProdaja)}&nbsp;USDT</span></div>
      <div class="sr"><span class="sr-lbl">Выручка (₽)</span>             <span class="sr-val">${fRub(c.totalRevenue)}</span></div>
      <div class="sr"><span class="sr-lbl">Доплат из своих (₽)</span>     <span class="sr-val" style="color:${c.totalTopUp > 0 ? 'var(--warn)' : 'inherit'}">${c.totalTopUp > 0 ? '−\u00a0' + fRub(c.totalTopUp) : '0\u00a0₽'}</span></div>
      <div class="sr"><span class="sr-lbl">Прибыль (USDT)</span>          <span class="sr-val" style="color:${pp?'var(--ok)':'var(--bad)'}">${pp?'+':''}${fmtUsdt.format(c.profit)}&nbsp;USDT</span></div>
    </div>

    <div class="form-acts">
      <button class="btn btn-prim" onclick="editOrder('${o.id}')">Редактировать</button>
      <button class="btn btn-dang" onclick="askDel('${o.id}')">Удалить</button>
    </div>`;
}

/* ═══════════════════════════════════
   DELETE
═══════════════════════════════════ */
let delId = null;
function askDel(id) {
  delId = id;
  const o   = orders.find(x => x.id===id);
  const lbl = o ? (o.name || 'этот ордер') : 'этот ордер';
  document.getElementById('modal-ttl').textContent  = 'Удалить ордер?';
  document.getElementById('modal-body').textContent = `«${lbl}» будет удалён без возможности восстановления.`;
  document.getElementById('modal-ok').onclick = doDel;
  document.getElementById('overlay').classList.add('on');
}
function doDel() { orders = orders.filter(o => o.id !== delId); persOrders(); delId=null; closeModal(); goList(); }
function closeModal() { document.getElementById('overlay').classList.remove('on'); delId=null; }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* ═══════════════════════════════════
   INIT
═══════════════════════════════════ */
loadOrders();
renderList();
</script>
</body>
</html>
